version: "3.8"

services:
  defect-service:
    build: .
    image: ai-defect-system:latest
    container_name: ai-defect-system
    restart: unless-stopped
    ports:
      # 왼쪽 값(호스트 포트)만 NAS 사정에 맞게 바꾸면 된다. NAS의 8080이 이미 다른 서비스가 쓰고 있어 18030으로 매핑.
      - "18030:8080"
    environment:
      - DMS_HOST=0.0.0.0
      - DMS_PORT=8080
      - DMS_BOOTSTRAP_ADMIN=admin
      # Quality Admin 로그인(#/admin-login)에 필요한 관리자 비밀번호. 비워두면 관리자 로그인 자체가 거부된다.
      # 반드시 아래 기본값을 바꿔서 사용할 것.
      - DMS_ADMIN_PASSWORD=change-me-before-deploy
      - TZ=Asia/Seoul
    volumes:
      # NAS 재부팅/컨테이너 재생성 후에도 데이터가 유지되도록 호스트 경로에 영구 저장한다.
      - ./data:/app/data
      - ./uploads:/app/uploads
      - ./backup:/app/backup
      - ./logs:/app/logs
